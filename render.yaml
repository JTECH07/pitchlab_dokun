services:
  - type: web
    name: pitchlab-dokun
    runtime: docker
    # Build : installe les dépendances, compile les assets, puis lance les migrations
    buildCommand: >
      composer install --no-dev --optimize-autoloader &&
      npm install --ignore-scripts &&
      npm run build &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://pitchlab-dokun.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # Sessions stockées en base (table sessions créée par migration)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      # Les variables sensibles sont à renseigner dans le dashboard Render :
      # APP_KEY, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD,
      # FEDAPAY_PUBLIC_KEY, FEDAPAY_SECRET_KEY, FEDAPAY_ENV,
      # GEMINI_API_KEY, MAIL_*, APP_NAME
